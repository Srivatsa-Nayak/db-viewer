name: CodeQL

# Code scanning for both apps. Free on a public repository; results appear under
# Security -> Code scanning, and a new alert on a pull request shows on the PR itself.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: db-viewer-backend
        run: |
          chmod +x mvnw
          ./mvnw -B -q compile -DskipTests

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
