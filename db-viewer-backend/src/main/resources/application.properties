# ==========================================
# Database Visualizer - Application Config
# ==========================================

# Application version
# @project.version@ is substituted by Maven resource filtering, which
# spring-boot-starter-parent configures with @ delimiters for this file. The value is
# served by GET /version and shown in the UI's info modal.
app.version=@project.version@

# Server
server.port=8080

# SQLite (default)
# This is the fallback database used only by requests that carry no workspace id
# (Swagger, curl, health checks). The UI always sends X-Workspace-Id.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./visualizer.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.dbviewer.app=INFO
logging.level.org.springframework.jdbc=DEBUG

# App Driver Mode (sqlite or mysql)
app.db.driver=sqlite

# Authentication
# Signing key for session tokens. MUST be set (32+ chars) in any real deployment - when it is
# blank a random key is generated at startup, which signs everyone out on every restart.
app.auth.secret=${AUTH_SECRET:}

# Local secrets, if there are any. `optional:` means a checkout without the file still
# boots — the values below are the fallbacks. Keep real keys in local.properties, which
# is gitignored; this file is tracked and must never hold one.
spring.config.import=optional:file:./local.properties

# Chat assistant (canvas AI)
# The application's own model key - the fallback used when a signed-in user has not
# supplied one of their own in their profile. Leave it blank and the assistant reports
# itself unavailable until a user brings their own key, which is a working deployment,
# just not a free one.
# Provider is OPENROUTER, ANTHROPIC or OPENAI. Model is optional; each provider has a
# sensible default (see LlmProvider).
app.llm.api-key=${LLM_API_KEY:}
app.llm.provider=${LLM_PROVIDER:OPENROUTER}
app.llm.model=${LLM_MODEL:}
# Output-token ceiling per answer. Thinking models spend part of it before writing, so it is
# well above the length of any answer; 8192 fits every default model's output limit.
app.llm.max-tokens=${LLM_MAX_TOKENS:8192}
# Anthropic only: output_config.effort (low | medium | high). Blank sends nothing, because
# older models reject the field. "low" is plenty for schema questions on current models.
app.llm.anthropic-effort=${LLM_ANTHROPIC_EFFORT:}
# No temperature is sent unless this is set: current Claude models and OpenAI reasoning
# models reject sampling parameters with a 400.
# app.llm.temperature=0.2
# Base URLs, for a gateway rather than the vendor's public endpoint - Azure OpenAI,
# LiteLLM, or an internal proxy that adds logging or a spend cap. Leave unset to use
# the vendor directly.
# app.llm.openrouter-base-url=https://openrouter.ai/api/v1
# app.llm.openai-base-url=https://api.openai.com/v1
# app.llm.anthropic-base-url=https://api.anthropic.com/v1

# Sent to OpenRouter for usage attribution; ignored by the other providers.
app.llm.site-url=${LLM_SITE_URL:http://localhost:3000}
app.llm.site-name=DB Viewer

# A streamed answer holds the request open for as long as the model takes to write it.
# The default async timeout would cut a long schema summary off mid-sentence.
spring.mvc.async.request-timeout=180000

# Workspace isolation
# Every SQL file open in the UI is a workspace with its own database, so two files
# can each define a table of the same name. In SQLite mode each workspace is a
# separate .db file in this directory; in MySQL mode it is a separate schema.
app.workspace.dir=${WORKSPACE_DIR:./data/workspaces}
