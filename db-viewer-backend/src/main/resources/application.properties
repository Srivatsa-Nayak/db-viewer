# ==========================================
# Database Visualizer - Application Config
# ==========================================

# Application version
# @project.version@ is substituted by Maven resource filtering, which
# spring-boot-starter-parent configures with @ delimiters for this file. The value is
# served by GET /version and shown in the UI's info modal.
app.version=@project.version@

# Server
server.port=8080

# SQLite (default)
# This is the fallback database used only by requests that carry no workspace id
# (Swagger, curl, health checks). The UI always sends X-Workspace-Id.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./visualizer.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:50MB}

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# On by default because the README links the live Swagger UI. Set SWAGGER_ENABLED=false to turn
# both the UI and the JSON description off.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Logging
logging.level.com.dbviewer.app=INFO
# SQL statement logging is for local debugging only; at DEBUG every query is written to the log,
# including statements built from users' data. Set LOG_SQL=DEBUG to see them.
logging.level.org.springframework.jdbc=${LOG_SQL:WARN}

# App Driver Mode (sqlite or mysql)
app.db.driver=sqlite

# Authentication
# Signing key for session tokens. MUST be set (32+ chars) in any real deployment - when it is
# blank a random key is generated at startup, which signs everyone out on every restart.
app.auth.secret=${AUTH_SECRET:}

# Local secrets, if there are any. `optional:` means a checkout without the file still
# boots — the values below are the fallbacks. Keep real keys in local.properties, which
# is gitignored; this file is tracked and must never hold one.
spring.config.import=optional:file:./local.properties

# Chat assistant (canvas AI)
# The application's own model key - the fallback used when a signed-in user has not
# supplied one of their own in their profile. Leave it blank and the assistant reports
# itself unavailable until a user brings their own key, which is a working deployment,
# just not a free one.
# Provider is OPENROUTER, ANTHROPIC or OPENAI. Model is optional; each provider has a
# sensible default (see LlmProvider).
app.llm.api-key=${LLM_API_KEY:}
app.llm.provider=${LLM_PROVIDER:OPENROUTER}
app.llm.model=${LLM_MODEL:}
# Output-token ceiling per answer. Thinking models spend part of it before writing, so it is
# well above the length of any answer; 8192 fits every default model's output limit.
app.llm.max-tokens=${LLM_MAX_TOKENS:8192}
# Anthropic only: output_config.effort (low | medium | high). Blank sends nothing, because
# older models reject the field. "low" is plenty for schema questions on current models.
app.llm.anthropic-effort=${LLM_ANTHROPIC_EFFORT:}
# No temperature is sent unless this is set: current Claude models and OpenAI reasoning
# models reject sampling parameters with a 400.
# app.llm.temperature=0.2
# Base URLs, for a gateway rather than the vendor's public endpoint - Azure OpenAI,
# LiteLLM, or an internal proxy that adds logging or a spend cap. Leave unset to use
# the vendor directly.
# app.llm.openrouter-base-url=https://openrouter.ai/api/v1
# app.llm.openai-base-url=https://api.openai.com/v1
# app.llm.anthropic-base-url=https://api.anthropic.com/v1

# Sent to OpenRouter for usage attribution; ignored by the other providers.
app.llm.site-url=${LLM_SITE_URL:http://localhost:3000}
app.llm.site-name=DB Viewer

# A streamed answer holds the request open for as long as the model takes to write it.
# The default async timeout would cut a long schema summary off mid-sentence.
spring.mvc.async.request-timeout=180000

# Browser origins allowed to call the API (comma-separated; patterns like https://*.example.com
# work). The deployed UI must be listed, or every request from it fails with a CORS error.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://db-viewer-ui-srivatsa.azurewebsites.net}

# Spend control on the app's own model key. Per user per hour and per day (in memory), and
# across everyone per day (counted from the llm_usage table, so it survives a restart).
# 0 means unlimited. A user's own key has only the looser hourly limit.
app.llm.quota.app-key-per-hour=${LLM_QUOTA_PER_HOUR:20}
app.llm.quota.app-key-per-day=${LLM_QUOTA_PER_DAY:100}
app.llm.quota.app-key-global-per-day=${LLM_QUOTA_GLOBAL_PER_DAY:1000}
app.llm.quota.own-key-per-hour=${LLM_QUOTA_OWN_KEY_PER_HOUR:120}
# Optional separate root for encrypting saved API keys. Unset, AUTH_SECRET is used (through its
# own derived key). Set it, and rotating AUTH_SECRET no longer makes saved keys unreadable.
app.llm.key-secret=${LLM_KEY_SECRET:}

# Request limits per client address (see RateLimitFilter). Behind Azure the address comes from
# the last X-Forwarded-For hop; set RATE_LIMIT_TRUST_FORWARDED_FOR=false if the app is reachable
# without a proxy in front of it.
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.ratelimit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:true}

# Workspace housekeeping (WorkspaceJanitor). Idle connections are closed; anonymous files unused
# for the retention period are deleted (0 keeps them for ever). Signed-in users' files are never
# swept.
app.workspace.idle-close-minutes=${WORKSPACE_IDLE_CLOSE_MINUTES:30}
app.workspace.max-open=${WORKSPACE_MAX_OPEN:200}
app.workspace.anonymous-retention-days=${WORKSPACE_ANONYMOUS_RETENTION_DAYS:30}

# Import limits, so one file cannot occupy the instance. Statements in a .sql script; data rows
# in a CSV.
app.import.max-statements=${IMPORT_MAX_STATEMENTS:20000}
app.import.max-csv-rows=${IMPORT_MAX_CSV_ROWS:200000}

# Workspace isolation
# Every SQL file open in the UI is a workspace with its own database, so two files
# can each define a table of the same name. In SQLite mode each workspace is a
# separate .db file in this directory; in MySQL mode it is a separate schema.
app.workspace.dir=${WORKSPACE_DIR:./data/workspaces}

# Health check for the host (Azure App Service > Health check > path /actuator/health).
# Only the health endpoint is exposed, and only as UP/DOWN: details would describe the database.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.info.env.enabled=false
