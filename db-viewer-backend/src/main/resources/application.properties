# ==========================================
# Database Visualizer - Application Config
# ==========================================

# Application version
# @project.version@ is substituted by Maven resource filtering, which
# spring-boot-starter-parent configures with @ delimiters for this file. The value is
# served by GET /version and shown in the UI's info modal.
app.version=@project.version@

# Server
server.port=8080

# SQLite (default)
# This is the fallback database used only by requests that carry no workspace id
# (Swagger, curl, health checks). The UI always sends X-Workspace-Id.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./visualizer.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.dbviewer=INFO
logging.level.org.springframework.jdbc=DEBUG

# App Driver Mode (sqlite or mysql)
app.db.driver=sqlite

# Workspace isolation
# Every SQL file open in the UI is a workspace with its own database, so two files
# can each define a table of the same name. In SQLite mode each workspace is a
# separate .db file in this directory; in MySQL mode it is a separate schema.
app.workspace.dir=${WORKSPACE_DIR:./data/workspaces}
