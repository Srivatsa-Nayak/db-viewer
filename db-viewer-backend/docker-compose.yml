version: "3.9"

# ─────────────────────────────────────────────────────────────────
# Usage:
#   SQLite mode (default):
#     docker-compose up app
#
#   MySQL mode:
#     docker-compose --profile mysql up
# ─────────────────────────────────────────────────────────────────

services:

  # ── Spring Boot App (SQLite) ──────────────────────────────────
  app:
    build: .
    container_name: db-viewer-app
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/visualizer.db
      WORKSPACE_DIR: /data/workspaces
      PORT: "8080"
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MySQL (optional profile) ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: db-viewer-mysql
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dbviewer
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot App (MySQL mode) ─────────────────────────────
  app-mysql:
    build: .
    container_name: db-viewer-app-mysql
    profiles: ["mysql"]
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: dbviewer
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db-data:
  mysql-data:
